# Reusable workflow for C/C++ projects using GNU Autotools.
#
# Abstraction choices:
#   - Split into two jobs (build, test) so test matrices can scale independently
#     and build artifacts are shared between them.
#   - The build tree is uploaded as an artifact and downloaded by the test job,
#     avoiding a second configure + compile cycle.
#   - Bootstrap is auto-detected: ./bootstrap > ./autogen.sh > autoreconf -fi.
#   - Valgrind is opt-in via `enable-valgrind`.
#   - Setup steps are inlined here because `uses: org/repo/.github/workflows/...`
#     cannot reference sibling composite actions with relative `./` paths.
#     Consumers who want the composite action directly should copy it into their
#     repo's `.github/actions/` directory or reference it via external path.

name: 'C/C++ Autotools CI'

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to check out. Defaults to the calling workflow''s ref.'
        required: false
        type: string
        default: ''
      configure-command:
        description: 'Full ./configure invocation (may include env vars).'
        required: false
        type: string
        default: './configure'
      build-command:
        description: 'Command to compile the project.'
        required: false
        type: string
        default: 'make -j2'
      test-command:
        description: 'Command to run unit tests.'
        required: false
        type: string
        default: 'make check'
      test-working-directory:
        description: 'Subdirectory to cd into before running tests.'
        required: false
        type: string
        default: ''
      enable-valgrind:
        description: 'Run Valgrind checks after standard tests.'
        required: false
        type: boolean
        default: false
      valgrind-command:
        description: 'Valgrind test command.'
        required: false
        type: string
        default: 'make check-valgrind'
      bootstrap-command:
        description: 'Explicit bootstrap command (empty = auto-detect).'
        required: false
        type: string
        default: ''
      artifact-name:
        description: 'Name prefix for the build artifact.'
        required: false
        type: string
        default: 'build-tree'
      runs-on:
        description: 'GitHub Actions runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      install-valgrind:
        description: 'Install Valgrind in the build environment.'
        required: false
        type: boolean
        default: false
      install-clang-tools:
        description: 'Install clang-tidy and clang-format.'
        required: false
        type: boolean
        default: false
      project-deps:
        description: 'Extra apt packages (space-separated).'
        required: false
        type: string
        default: ''

    # Exposed to consumers for custom reporting (e.g. tri-state check runs).
    outputs:
      build-result:
        description: 'Outcome of the build job overall, i.e. configure-result OR compile-result (success/failure).'
        value: ${{ jobs.build.outputs.result }}
      configure-result:
        description: 'Outcome of the Configure step alone (success/failure).'
        value: ${{ jobs.build.outputs.configure-result }}
      compile-result:
        description: 'Outcome of the Compile step alone (success/failure/skipped -- skipped if Configure failed).'
        value: ${{ jobs.build.outputs.compile-result }}
      test-result:
        description: 'Combined outcome of the test job, including Valgrind if enabled (success/failure).'
        value: ${{ jobs.test.outputs.result }}
      unit-test-result:
        description: 'Outcome of the unit-test step alone, excluding Valgrind (success/failure).'
        value: ${{ jobs.test.outputs.unit-test-result }}
      valgrind-result:
        description: 'Outcome of the Valgrind checks alone (success/failure/skipped).'
        value: ${{ jobs.test.outputs.valgrind-result }}
      build-duration-seconds:
        description: 'Wall-clock seconds spent in the Configure+Compile steps.'
        value: ${{ jobs.build.outputs.duration-seconds }}
      test-duration-seconds:
        description: 'Wall-clock seconds spent running test-command (unit tests only, excluding Valgrind).'
        value: ${{ jobs.test.outputs.duration-seconds }}
      test-summary:
        description: >
          Free-form Markdown a consumer's test-command may optionally write, for richer
          reporting than the plain success/failure outputs above. If test-command writes
          to the file path in $RICH_TEST_SUMMARY_FILE, its content is passed through
          verbatim here; consumers that don't use the convention get an empty string.
        value: ${{ jobs.test.outputs.test-summary }}
      valgrind-summary:
        description: >
          Same convention as test-summary, for valgrind-command via
          $RICH_VALGRIND_SUMMARY_FILE. Content is opaque to this workflow --
          a consumer wanting structured (not just Markdown) data back, e.g.
          JSON for building Checks API annotations, can write that instead;
          nothing here parses or validates the content either way.
        value: ${{ jobs.test.outputs.valgrind-summary }}

jobs:
  build:
    name: 'Build'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      # Propagate the build step's outcome to the workflow output.
      result: ${{ steps.aggregate-build.outputs.outcome }}
      configure-result: ${{ steps.aggregate-build.outputs.configure-outcome }}
      compile-result: ${{ steps.aggregate-build.outputs.compile-outcome }}
      duration-seconds: ${{ steps.timing.outputs.duration-seconds }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The build tree (including .git/) is archived into an artifact
          # below; a persisted token in .git/config would ship with it.
          persist-credentials: false

      - name: Record build start time
        id: start-time
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install Autotools toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autoconf libtool pkg-config \
            flex bison gawk

      - name: Install project-specific dependencies
        if: ${{ inputs.project-deps != '' }}
        shell: bash
        env:
          PROJECT_DEPS: ${{ inputs.project-deps }}
        run: |
          # Word splitting is intended (space-separated package list);
          # globbing is not.
          set -f
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PROJECT_DEPS

      - name: Install Valgrind
        if: ${{ inputs.install-valgrind }}
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Install Clang static analysis tools
        if: ${{ inputs.install-clang-tools }}
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends clang-tidy clang-format

      - name: Bootstrap build system
        if: ${{ inputs.bootstrap-command != '' }}
        shell: bash
        env:
          BOOTSTRAP_COMMAND: ${{ inputs.bootstrap-command }}
        run: eval "$BOOTSTRAP_COMMAND"

      - name: Auto-detect bootstrap
        if: ${{ inputs.bootstrap-command == '' }}
        shell: bash
        run: |
          if [ -x ./bootstrap ]; then
            ./bootstrap
          elif [ -f ./autogen.sh ]; then
            sh ./autogen.sh
          else
            autoreconf -fi
          fi

      # The *-command inputs are code by design: the caller's workflow file
      # is the trust boundary, so never build one from untrusted context
      # (branch names, PR text). They reach the shell via env + eval rather
      # than ${{ }} splicing, so no step here has an expression in its
      # script text; bash parses them exactly as before.
      - name: Configure
        id: configure
        continue-on-error: true
        shell: bash
        env:
          CONFIGURE_COMMAND: ${{ inputs.configure-command }}
        run: eval "$CONFIGURE_COMMAND"

      - name: Compile
        id: compile
        # Skip rather than let a doomed compile fail too -- keeps Compile's
        # own outcome meaningful (skipped, not a second failure) when the
        # real problem was Configure.
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"

      - name: Aggregate build outcome
        id: aggregate-build
        if: always()
        shell: bash
        env:
          configure_outcome: ${{ steps.configure.outcome }}
          compile_outcome: ${{ steps.compile.outcome }}
        run: |
          result="success"
          if [ "$configure_outcome" = "failure" ] || [ "$compile_outcome" = "failure" ]; then
            result="failure"
          fi
          {
            echo "outcome=$result"
            echo "configure-outcome=$configure_outcome"
            echo "compile-outcome=${compile_outcome:-skipped}"
          } >> "$GITHUB_OUTPUT"

      - name: Record build duration
        id: timing
        if: always()
        shell: bash
        env:
          START_EPOCH: ${{ steps.start-time.outputs.epoch }}
        run: echo "duration-seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Archive build tree
        # actions/upload-artifact does not preserve executable bits, so pack
        # the tree into a tarball (which does) and upload that instead.
        if: always()
        shell: bash
        run: tar -cf build-tree.tar --exclude=build-tree.tar .

      - name: Upload build tree
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: build-tree.tar
          retention-days: 1
          if-no-files-found: ignore

      - name: Fail job if Configure or Compile failed
        if: ${{ steps.aggregate-build.outputs.outcome == 'failure' }}
        shell: bash
        run: exit 1

  test:
    name: 'Test'
    needs: build
    runs-on: ${{ inputs.runs-on }}
    # No checkout here, and artifacts come via the runtime token, so the
    # job that runs the tested code gets no GITHUB_TOKEN scopes at all.
    permissions: {}
    outputs:
      # Propagate the test step's outcome to the workflow output.
      result: ${{ steps.aggregate.outputs.outcome }}
      unit-test-result: ${{ steps.aggregate.outputs.unit-test-outcome }}
      valgrind-result: ${{ steps.aggregate.outputs.valgrind-outcome }}
      duration-seconds: ${{ steps.aggregate.outputs.duration-seconds }}
      test-summary: ${{ steps.aggregate.outputs.test-summary }}
      valgrind-summary: ${{ steps.aggregate.outputs.valgrind-summary }}

    steps:
      - name: Download build tree
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}

      - name: Extract build tree
        shell: bash
        run: tar -xf build-tree.tar && rm build-tree.tar

      - name: Install Autotools toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autoconf libtool pkg-config \
            flex bison gawk

      - name: Install project-specific dependencies
        if: ${{ inputs.project-deps != '' }}
        shell: bash
        env:
          PROJECT_DEPS: ${{ inputs.project-deps }}
        run: |
          # Word splitting is intended (space-separated package list);
          # globbing is not.
          set -f
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PROJECT_DEPS

      - name: Install Valgrind
        if: ${{ inputs.enable-valgrind }}
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Record test start time
        id: start-time
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        id: unit-test
        continue-on-error: true
        shell: bash
        # RICH_TEST_SUMMARY_FILE is a convention, not a requirement: if
        # test-command writes Markdown there (e.g. a parsed pass/fail/skip
        # count in a format only the consumer's own test runner knows),
        # it is surfaced verbatim via the test-summary output below. A
        # test-command that ignores the variable just leaves an empty file.
        env:
          RICH_TEST_SUMMARY_FILE: ${{ runner.temp }}/rich-test-summary.md
          TEST_WORKING_DIRECTORY: ${{ inputs.test-working-directory }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          if [ -n "$TEST_WORKING_DIRECTORY" ]; then
            cd "$TEST_WORKING_DIRECTORY"
          fi
          eval "$TEST_COMMAND"

      - name: Run Valgrind checks
        if: ${{ inputs.enable-valgrind && success() }}
        id: valgrind-test
        continue-on-error: true
        shell: bash
        # RICH_VALGRIND_SUMMARY_FILE mirrors RICH_TEST_SUMMARY_FILE above --
        # same opt-in convention, same pass-through, just for valgrind-command.
        env:
          RICH_VALGRIND_SUMMARY_FILE: ${{ runner.temp }}/rich-valgrind-summary.md
          TEST_WORKING_DIRECTORY: ${{ inputs.test-working-directory }}
          VALGRIND_COMMAND: ${{ inputs.valgrind-command }}
        run: |
          if [ -n "$TEST_WORKING_DIRECTORY" ]; then
            cd "$TEST_WORKING_DIRECTORY"
          fi
          eval "$VALGRIND_COMMAND"

      - name: Aggregate test outcome
        id: aggregate
        if: always()
        shell: bash
        env:
          RICH_TEST_SUMMARY_FILE: ${{ runner.temp }}/rich-test-summary.md
          RICH_VALGRIND_SUMMARY_FILE: ${{ runner.temp }}/rich-valgrind-summary.md
          # Passed as env vars and referenced as shell variables below --
          # deliberately NOT interpolated directly as ${{ inputs.test-command }}
          # inside this step's own run: script. GitHub Actions splices
          # ${{ }} expressions into the script text before bash ever sees
          # it; a test-command/valgrind-command that's a trivial one-liner
          # is safe that way, but either one can legitimately be an
          # arbitrary multi-line script (quotes, pipes, $()...), and
          # splicing that into the middle of *this* step's script gets it
          # re-parsed as bash here too, corrupting this step. Consuming it
          # as an env var's runtime value avoids that entirely.
          TEST_COMMAND: ${{ inputs.test-command }}
          VALGRIND_COMMAND: ${{ inputs.valgrind-command }}
          test_outcome: ${{ steps.unit-test.outcome }}
          vg_outcome: ${{ steps.valgrind-test.outcome }}
          START_EPOCH: ${{ steps.start-time.outputs.epoch }}
        run: |
          result="success"

          # Only the first line goes in the annotation -- the full
          # command (possibly multi-line) is already visible in the "Run
          # unit tests"/"Run Valgrind checks" step logs above.
          if [ "$test_outcome" = "failure" ]; then
            first_line=$(printf '%s\n' "$TEST_COMMAND" | head -n1)
            echo "::error title=Tests Failed::\`$first_line\` (test-command) reported failures. See the 'Run unit tests' step log for the full command and output."
            result="failure"
          fi
          if [ "$vg_outcome" = "failure" ]; then
            first_line=$(printf '%s\n' "$VALGRIND_COMMAND" | head -n1)
            echo "::error title=Valgrind Failed::\`$first_line\` (valgrind-command) found memory issues. See the 'Run Valgrind checks' step log for the full command and output."
            result="failure"
          fi
          if [ "$result" = "success" ]; then
            echo "::notice title=All Checks Passed::Tests and validation completed successfully."
          fi

          # The outcome outputs go first: should anything below go wrong,
          # consumers still get the real results rather than empty values.
          {
            echo "outcome=$result"
            echo "unit-test-outcome=$test_outcome"
            echo "valgrind-outcome=${vg_outcome:-skipped}"
            echo "duration-seconds=$(( $(date +%s) - START_EPOCH ))"
          } >> "$GITHUB_OUTPUT"

          # The summary files are written by the tested code, so a fixed
          # heredoc delimiter could appear in them (or a missing final
          # newline glue it to the content) and break the output file.
          # Use a random delimiter and make sure it starts its own line.
          emit_file_output() {
            local name=$1 file=$2 delim
            delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "$name<<$delim"
            if [ -s "$file" ]; then
              cat "$file"
              if [ -n "$(tail -c1 "$file")" ]; then
                echo
              fi
            fi
            echo "$delim"
          }
          {
            emit_file_output test-summary "$RICH_TEST_SUMMARY_FILE"
            emit_file_output valgrind-summary "$RICH_VALGRIND_SUMMARY_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Fail job if tests or Valgrind failed
        if: steps.aggregate.outputs.outcome == 'failure'
        shell: bash
        run: exit 1
